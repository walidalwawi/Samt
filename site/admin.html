<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Samt · Back office</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin/samt-admin.css?v=1">
</head>
<body>
<div class="bd-ad" id="bd-ad">
<header class="bd-ad-top" id="bd-top"></header>
<nav class="bd-ad-sub" id="bd-sub"></nav>
<div class="bd-ad-body">
<aside class="bd-ad-panel" id="bd-panel"></aside>
<section class="bd-ad-stage" id="bd-stage">
<div class="bd-ad-frame" id="bd-frame"><iframe id="bd-preview" title="Live preview"></iframe></div>
<div class="bd-ad-dim" id="bd-dim"></div>
</section>
</div>
</div>
<div class="bd-ad-gate" id="bd-gate" hidden>
<div class="bd-ad-gate-card">
<p class="bd-ad-note">Samt · back office</p>
<h1>Connect your GitHub key</h1>
<ol>
<li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → new fine-grained token</a></li>
<li>Repository access: <b>walidalwawi/samt</b></li>
<li>Permissions: <b>Contents → Read and write</b></li>
<li>Generate, copy, paste it here. It stays in this browser only.</li>
</ol>
<div class="bd-ad-gate-row">
<input class="bd-ad-input" id="bd-gate-key" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub key">
<button class="bd-ad-btn is-primary" id="bd-gate-go" type="button">Connect</button>
</div>
<div class="bd-ad-gate-msg" id="bd-gate-msg"></div>
</div>
</div>
<div class="bd-ad-toast" id="bd-toast" hidden></div>
<input type="file" id="bd-file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>
<script>
/* CRASH NOTICE — SHOW THE ERROR INSTEAD OF A BLANK SCREEN */
window.addEventListener("unhandledrejection", function (ev) {
var r = ev.reason || {};
window.dispatchEvent(new ErrorEvent("error", { message: "Unhandled: " + (r.message || r), filename: (r.stack || "").split("\n")[1] || "" }));
});
window.addEventListener("error", function (ev) {
if (document.getElementById("bd-crash")) return;
var d = document.createElement("div");
d.id = "bd-crash";
d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;padding:14px 16px;background:#1F1E1C;color:#fff;font:13px/1.45 system-ui,sans-serif;border-radius:6px");
d.innerHTML = "<b>The back office hit an error.</b> Reload the page. Your draft is saved. If it keeps happening, send Claude this line:<br><code style=\"display:block;margin-top:6px;white-space:pre-wrap;opacity:.8\"></code>";
d.querySelector("code").textContent = (ev.message || "Error") + (ev.filename ? " · " + ev.filename.split("/").pop() + ":" + ev.lineno : "");
document.body.appendChild(d);
});
</script>
<script src="/admin/samt-render.js?v=1"></script>
<script src="/admin/samt-admin.js?v=1"></script>
</body>
</html>
